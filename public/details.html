<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://w3aftab.github.io/default-html-styling-II/style.css"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <title>REST API Products - Details</title>
  </head>
  <body>
    <header>
      <h1 class="flex-items logo">REST API Products</h1>
    </header>
    <nav>
      <ul>
        <li>
          <a type="button" href="/">Home</a>
        </li>
      </ul>
    </nav>

    <section>
      <h2>Product Details</h2>
      <div id="selected-product"></div>

      <div class="details-btn-control">
        <button id="update-btn">Update</button>
        <button id="delete-btn">Delete</button>
      </div>
    </section>

    <section id="form-update-product">
      <h2>Update Product</h2>
      <form method="POST" id="form-update">
        <fieldset>
          <lebel for="name">Name</lebel>
          <input type="text" name="name" placeholder="Product name" required />
        </fieldset>
        <fieldset>
          <lebel for="price">Price</lebel>
          <input
            type="number"
            name="price"
            placeholder="Price in cents"
            step=".01"
            required
          />
        </fieldset>

        <fieldset class="form-control-btn">
          <button type="submit">Save Product</button>
        </fieldset>
      </form>
    </section>

    <script type="module" src="/js/details.js"></script>
  </body>
</html>
