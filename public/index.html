<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://w3aftab.github.io/default-html-styling-II/style.css"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <title>REST API Products</title>
  </head>
  <body>
    <header>
      <h1 class="flex-items logo">REST API Products</h1>
    </header>
    <nav>
      <ul>
        <li>
          <a type="button" href="/test">Test</a>
        </li>
      </ul>
    </nav>

    <div class="main flex">
      <section class="flex-items" id="">
        <h2>Add Prodect</h2>
        <form method="POST" id="form-add-product">
          <fieldset>
            <lebel for="name">Name</lebel>
            <input
              type="text"
              name="name"
              placeholder="Product name"
              required
            />
          </fieldset>
          <fieldset>
            <lebel for="price">Price</lebel>
            <input
              type="number"
              name="price"
              placeholder="Price in cents"
              step=".01"
              required
            />
          </fieldset>

          <fieldset class="form-control-btn">
            <button type="submit">Add Product</button>
          </fieldset>
        </form>
      </section>
      <section class="flex-items">
        <h2>All Products</h2>
        <form>
          <label for="search-name">Search by name:</label>
          <input
            type="search"
            id="search-name"
            name="name"
            placeholder="Product name"
          />
          <label for="search-price">Maximum price:</label>
          <input
            type="number"
            id="search-price"
            name="price"
            placeholder="Price"
            min="0"
            step=".01"
          />
          <label for="sort">Sort products:</label>
          <select id="sort" name="sort">
            <option value="">Default order</option>
            <option value="-name">Name: Z to A</option>
            <option value="name">Name: A to Z</option>
            <option value="price">Price: low to high</option>
            <option value="-price">Price: high to low</option>
          </select>
        </form>
        <div id="all-products"></div>
      </section>
    </div>

    <script type="module" src="/js/index.js"></script>

    <script></script>
  </body>
</html>
