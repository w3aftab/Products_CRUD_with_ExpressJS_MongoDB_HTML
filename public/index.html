<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://w3aftab.github.io/default-html-styling/basic.min.css"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <title>REST API Products</title>
  </head>
  <body>
    <header class="flex">
      <h1 class="flex-items logo">REST API Products</h1>
      <div class="flex-items navbar">
        <a type="button" href="/test">Test</a>
      </div>
    </header>

    <section>
      <div class="main flex">
        <div class="flex-items" id="">
          <h2>Add Prodect</h2>
          <form method="POST" id="form-add-product">
            <fieldset>
              <lebel for="name">Name</lebel>
              <input
                type="text"
                name="name"
                placeholder="Product name"
                required
              />
            </fieldset>
            <fieldset>
              <lebel for="price">Price</lebel>
              <input
                type="number"
                name="price"
                placeholder="Price in cents"
                step=".01"
                required
              />
            </fieldset>

            <fieldset class="form-control-btn">
              <button type="submit">Add Product</button>
            </fieldset>
          </form>
          <form action="/images" method="POST" enctype="multipart/form-data">
            <input type="file" name="imageFile" accept="image/*" required />
            <button type="submit">Upload Image</button>
          </form>
        </div>
        <div class="flex-items">
          <h2>All Products</h2>
          <div id="all-products"></div>
        </div>
      </div>
    </section>

    <script type="module" src="/js/index.js"></script>

    <script></script>
  </body>
</html>
